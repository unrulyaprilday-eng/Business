<!DOCTYPE html>
<html>
  <head>
    <title>子游戏列表</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet"/>
    <link href="data/styles.css" type="text/css" rel="stylesheet"/>
    <link href="files/子游戏列表/styles.css" type="text/css" rel="stylesheet"/>
    <link href="custom/css/子游戏列表.css" type="text/css" rel="stylesheet"/>
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>
    <script src="resources/scripts/axure/axQuery.js"></script>
    <script src="resources/scripts/axure/globals.js"></script>
    <script src="resources/scripts/axutils.js"></script>
    <script src="resources/scripts/axure/annotation.js"></script>
    <script src="resources/scripts/axure/axQuery.std.js"></script>
    <script src="resources/scripts/axure/doc.js"></script>
    <script src="resources/scripts/messagecenter.js"></script>
    <script src="resources/scripts/axure/events.js"></script>
    <script src="resources/scripts/axure/recording.js"></script>
    <script src="resources/scripts/axure/action.js"></script>
    <script src="resources/scripts/axure/expr.js"></script>
    <script src="resources/scripts/axure/geometry.js"></script>
    <script src="resources/scripts/axure/flyout.js"></script>
    <script src="resources/scripts/axure/model.js"></script>
    <script src="resources/scripts/axure/repeater.js"></script>
    <script src="resources/scripts/axure/sto.js"></script>
    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>
    <script src="resources/scripts/axure/math.js"></script>
    <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script>
    <script src="files/子游戏列表/data.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
  </head>
  <body>
    <div id="base" class="">
      <div class="custom-page-shell subgame-page">
        <nav class="crumb"><span>游戏中心</span><b>/</b><strong>子游戏列表</strong></nav>

        <section class="toolbar-panel">
          <form class="filter-grid">
            <label>供应商:<select><option>请选择厂商</option><option>GX-INR</option><option>HG-USD</option><option>GB-USD</option></select></label>
            <label>游戏类型:<select><option>请选择游戏类型</option><option>电子</option><option>区块链</option><option>捕鱼</option></select></label>
            <label>游戏名称:<input type="text" placeholder="请输入游戏名称"/></label>
            <label>游戏开关:<select><option>请选择游戏开关</option><option>开启</option><option>关闭</option></select></label>
            <label>热门开关:<select><option>请选择热门开关</option><option>开启</option><option>关闭</option></select></label>
            <button class="primary-btn" type="button">搜索</button>
            <button class="plain-btn" type="reset">重置</button>
          </form>
          <div class="actions">
            <div class="batch-dropdown">
              <button class="primary-btn batch-toggle" id="batchToggle" type="button" aria-expanded="false">批量操作</button>
              <div class="batch-menu" id="batchMenu" hidden>
                <button type="button" data-batch="enabled:on">游戏开关-开启</button>
                <button type="button" data-batch="enabled:off">游戏开关-关闭</button>
                <button type="button" data-batch="hot:on">热门开关-开启</button>
                <button type="button" data-batch="hot:off">热门开关-关闭</button>
              </div>
            </div>
            <button class="plain-btn" type="button">同步游戏</button>
          </div>
        </section>

        <section class="table-panel">
          <table class="data-table">
            <thead>
              <tr>
                <th><input id="selectAllRows" type="checkbox"/></th><th>排序</th><th>游戏ID</th><th>游戏名称</th><th>供应商</th><th>厂商</th><th>游戏类型</th><th>热门开关</th><th>游戏开关</th><th>图标</th><th>激活图标</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="gameRows"></tbody>
          </table>
        </section>

        <footer class="pager"><span>|&lt;</span><span>&lt;&lt;</span><span>&lt;</span><strong>1</strong><span>/ 15</span><span>&gt;</span><span>&gt;&gt;</span><span>&gt;|</span><button>20条/页</button><span>共 281 条记录</span></footer>

        <div class="modal-mask" id="editModal" hidden>
          <section class="edit-modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
            <header><h2 id="editTitle">编辑子游戏</h2><button class="icon-close" type="button" data-close>×</button></header>
            <div class="modal-body">
              <label class="form-row upload-row"><span>图标</span><div><div class="image-card"><img id="modalIcon" alt="图标"/><button class="remove" type="button">×</button></div><p>请上传180*180或等比例，PNG/JPG/GIF格式小于100KB的图片</p></div></label>
              <label class="form-row upload-row"><span>激活图标</span><div><div class="image-card tall"><img id="modalActiveIcon" alt="激活图标"/><button class="remove" type="button">×</button></div><p>请上传320*427或等比例，PNG/JPG/GIF格式小于100KB的图片</p></div></label>
              <label class="form-row"><span>排序</span><div class="stepper"><input id="modalSort" type="number" value="1"/><button type="button">＋</button><button type="button">－</button></div></label>
              <label class="form-row switch-row"><span>热门</span><input id="modalHot" class="switch-input" type="checkbox"/><i></i><em>否</em></label>
              <label class="form-row switch-row"><span>状态</span><input id="modalStatus" class="switch-input" type="checkbox" checked/><i></i><em>启用</em></label>
            </div>
            <footer><button class="plain-btn" type="button" data-close>取消</button><button class="primary-btn" type="button" data-close>确定</button></footer>
          </section>
        </div>
      </div>
    </div>
    <script src="custom/js/子游戏列表.js"></script>
    <script src="custom/js/axure-custom-page-ready.js"></script>
    <script src="resources/scripts/axure/ios.js"></script>
  </body>
</html>
