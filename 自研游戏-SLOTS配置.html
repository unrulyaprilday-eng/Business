  <body>
    <div id="base" class=""><div class="self-game-page"><div class="self-game-shell">
      <nav class="self-game-breadcrumb"><span>游戏中心</span><b>/</b><span>自研游戏配置</span><b>/</b><strong>SLOTS 配置</strong></nav>
      <header class="self-game-header"><div><h1>SLOTS 配置</h1><p>配置自研 SLOTS 游戏的投注底分和购买 Free Game 权限。</p></div><div class="self-game-header-meta"><span>配置范围</span><strong>玩法参数</strong><span>不影响游戏开关和频道</span></div></header>
      <section class="self-game-panel"><form class="self-game-filter" id="typeFilterForm"><div class="self-game-filter-field"><label for="typeGameName">游戏名称 / 编码</label><input class="self-game-input" id="typeGameName" type="text" placeholder="请输入游戏名称或编码" /></div><div class="self-game-filter-actions"><button class="self-game-btn self-game-btn-primary" type="submit">查询</button><button class="self-game-btn self-game-btn-quiet" id="typeReset" type="button">重置</button></div></form></section>
      <section class="self-game-panel"><div class="self-game-panel-head"><div><h2>SLOTS 游戏列表</h2><p>基础能力由游戏服务提供，页面仅开放可配置的玩法参数。</p></div><span class="self-game-toolbar-note">共 3 个自研游戏</span></div><div class="self-game-panel-body"><div class="self-game-config-tabs"><button class="self-game-config-tab is-active" type="button" data-self-tab-group="slotsTabs" data-self-tab="config">参数配置</button><button class="self-game-config-tab" type="button" data-self-tab-group="slotsTabs" data-self-tab="records">变更记录</button></div><section data-self-tab-group="slotsTabs" data-self-tab-panel="config"><div class="self-game-table-wrap"><table class="self-game-table self-game-type-table"><thead><tr><th>游戏编码</th><th>游戏名称</th><th>玩法能力</th><th>RTP</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="typeRows"><tr><td>SLOT-1001</td><td>星穹宝藏</td><td>底分 1 / 5 / 10 · Free Game 支持</td><td class="number-cell">96.0%</td><td>2026-08-18 09:30</td><td><button class="self-game-link" type="button">配置</button></td></tr></tbody></table></div></section><section data-self-tab-group="slotsTabs" data-self-tab-panel="records" hidden><div class="self-game-table-wrap self-game-records"><table class="self-game-table"><thead><tr><th>时间</th><th>游戏</th><th>操作</th><th>RTP 变化</th><th>操作人</th></tr></thead><tbody id="recordRows"></tbody></table></div></section></div></section>
    </div></div>
    <div class="self-game-modal-layer" id="configModal" hidden><div class="self-game-modal-mask" data-config-close></div><section class="self-game-modal" role="dialog" aria-modal="true" aria-labelledby="configTitle"><header class="self-game-modal-head"><h2 id="configTitle">SLOTS 配置</h2><button class="self-game-close" type="button" data-config-close aria-label="关闭">×</button></header><div class="self-game-modal-body"><div class="self-game-capabilities" id="configCapability"></div><div class="self-game-form-grid"><div class="self-game-form-field"><label>游戏名称</label><div class="self-game-readonly" id="configGameName">-</div></div><div class="self-game-form-field"><label>游戏编码</label><div class="self-game-readonly" id="configGameCode">-</div></div><div class="self-game-form-field"><label for="configRtp">RTP</label><div class="self-game-input-wrap"><input class="self-game-input self-game-rtp-input" id="configRtp" type="number" min="50" max="200" step="0.1" value="96.0" /><span class="self-game-input-suffix">%</span></div><p class="self-game-field-error" id="configRtpError" hidden></p></div><div class="self-game-form-field"><label>校验规则</label><div class="self-game-readonly">50.0%～200.0%，步长 0.1%</div></div></div><div id="configFields"></div><div class="self-game-batch-preview" id="configModalError" hidden></div></div><footer class="self-game-modal-foot"><button class="self-game-btn self-game-btn-quiet" type="button" data-config-close>取消</button><button class="self-game-btn self-game-btn-primary" id="applyConfig" type="button">立即生效</button></footer></section></div>
    <div class="self-game-toast" hidden></div>
    </div>
