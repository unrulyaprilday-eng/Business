  <body>
    <div id="base" class="">
      <div class="custom-page-shell player-count-page">
        <nav class="page-crumb"><span>数据报表</span><b>/</b><strong>游戏人数报表</strong></nav>

        <section class="filter-panel" aria-label="筛选条件">
          <div class="date-group">
            <label><span>开始日期</span><input type="date" value="2026-05-01"/></label>
            <em>至</em>
            <label><span>结束日期</span><input type="date" value="2026-05-30"/></label>
          </div>
          <div class="quick-range" aria-label="快捷日期">
            <button class="quick-btn" type="button">今日</button>
            <button class="quick-btn" type="button">昨日</button>
            <button class="quick-btn active" type="button">近7日</button>
            <button class="quick-btn" type="button">近30日</button>
          </div>
          <div class="toolbar-actions">
            <button class="primary-btn" type="button">搜索</button>
            <button class="plain-btn" type="reset">重置</button>
            <button class="export-btn" type="button">导出表格</button>
          </div>
        </section>

        <main class="report-layout">
          <section class="table-panel" aria-label="游戏人数列表">
            <div class="panel-head">
              <h2>明细数据</h2>
              <span>按日期倒序展示</span>
            </div>
            <table class="count-table">
              <thead>
                <tr>
                  <th>日期</th>
                  <th>游戏人数统计</th>
                  <th>游戏人次统计</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>2026-05-30</td><td>1</td><td>2</td></tr>
                <tr><td>2026-05-29</td><td>10</td><td>21</td></tr>
                <tr><td>2026-05-28</td><td>8</td><td>17</td></tr>
                <tr><td>2026-05-27</td><td>18</td><td>42</td></tr>
                <tr><td>2026-05-26</td><td>12</td><td>26</td></tr>
                <tr><td>2026-05-25</td><td>11</td><td>24</td></tr>
                <tr><td>2026-05-24</td><td>1</td><td>2</td></tr>
                <tr><td>2026-05-23</td><td>8</td><td>19</td></tr>
                <tr><td>2026-05-22</td><td>22</td><td>48</td></tr>
                <tr><td>2026-05-21</td><td>3</td><td>6</td></tr>
                <tr><td>2026-05-20</td><td>3</td><td>7</td></tr>
                <tr><td>2026-05-19</td><td>1</td><td>3</td></tr>
              </tbody>
            </table>
            <div class="pagination">
              <button type="button">‹</button>
              <button class="current" type="button">1</button>
              <span>/ 3</span>
              <button type="button">›</button>
              <select aria-label="每页条数">
                <option>20条/页</option>
                <option>50条/页</option>
              </select>
              <strong>共 46 条记录</strong>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="resources/scripts/axure/ios.js"></script>
  </body>
</html>
