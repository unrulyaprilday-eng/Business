<head>

  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #263b3c;
      background: #e6eff0;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    button, input { font: inherit; }

    .stage {
      --gallop: .76s;
      --drift: 9s;
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #e6eff0;
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .masthead {
      position: absolute;
      z-index: 2;
      top: 30px;
      left: 38px;
      pointer-events: none;
    }

    .masthead p {
      margin: 0 0 7px;
      color: #8b4740;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .masthead h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
    }

    .controls {
      position: absolute;
      z-index: 2;
      top: 30px;
      right: 38px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 50px;
      padding: 6px 10px 6px 7px;
      border: 1px solid rgba(38, 59, 60, .16);
      border-radius: 8px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 5px 18px rgba(39, 63, 58, .08);
      backdrop-filter: blur(8px);
    }

    .motion-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: none;
      padding: 0;
      border: 0;
      border-radius: 5px;
      color: #fff;
      background: #315f65;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }

    .motion-button:hover { background: #244b50; }
    .motion-button:focus-visible,
    .speed input:focus-visible { outline: 3px solid #73afb8; outline-offset: 3px; }

    .speed {
      display: flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
      color: #40595b;
      font-size: 12px;
      font-weight: 700;
    }

    .speed input {
      width: 95px;
      margin: 0;
      accent-color: #315f65;
      cursor: pointer;
    }

    .speed output {
      width: 31px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .caption {
      position: absolute;
      z-index: 2;
      left: 40px;
      bottom: 27px;
      margin: 0;
      color: rgba(43, 67, 66, .68);
      font-size: 12px;
      font-weight: 700;
    }

    .cloud-one { animation: cloud-drift calc(var(--drift) * 2.6) ease-in-out infinite alternate; }
    .cloud-two { animation: cloud-drift calc(var(--drift) * 3.4) ease-in-out infinite alternate-reverse; }
    .cloud-three { animation: cloud-drift calc(var(--drift) * 2.1) ease-in-out infinite alternate; }
    .ground-dash { animation: track-run calc(var(--gallop) * 2.2) linear infinite; }
    .ride { animation: body-bob var(--gallop) ease-in-out infinite; }
    .shadow { transform-origin: 715px 675px; animation: shadow-pulse var(--gallop) ease-in-out infinite; }
    .far-back-leg { transform-origin: 548px 550px; animation: leg-back var(--gallop) ease-in-out infinite; }
    .far-front-leg { transform-origin: 835px 547px; animation: leg-front var(--gallop) ease-in-out infinite; }
    .near-back-leg { transform-origin: 580px 554px; animation: leg-front var(--gallop) ease-in-out infinite; }
    .near-front-leg { transform-origin: 864px 540px; animation: leg-back var(--gallop) ease-in-out infinite; }
    .tail { transform-origin: 499px 500px; animation: tail-wag calc(var(--gallop) * 1.3) ease-in-out infinite; }
    .cape { transform-origin: 691px 358px; animation: cape-flutter calc(var(--gallop) * 1.5) ease-in-out infinite; }
    .plume-left { transform-origin: 716px 256px; animation: plume-wave calc(var(--gallop) * 2) ease-in-out infinite; }
    .plume-right { transform-origin: 724px 255px; animation: plume-wave calc(var(--gallop) * 2) ease-in-out infinite reverse; }
    .halberd { transform-origin: 787px 383px; animation: spear-tilt calc(var(--gallop) * 2) ease-in-out infinite; }
    .dust-a { animation: dust-puff var(--gallop) ease-out infinite; }
    .dust-b { animation: dust-puff var(--gallop) ease-out infinite .35s; }
    .spark { animation: spark-fade calc(var(--gallop) * 2) ease-in-out infinite; }

    .scene * { transform-box: view-box; }
    .stage.is-paused .scene * { animation-play-state: paused !important; }

    @keyframes cloud-drift { from { transform: translateX(-28px); } to { transform: translateX(38px); } }
    @keyframes track-run { to { stroke-dashoffset: 176; } }
    @keyframes body-bob { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(8px); } 50% { transform: translateY(-7px); } 75% { transform: translateY(5px); } }
    @keyframes shadow-pulse { 0%, 100% { transform: scaleX(1); opacity: .34; } 50% { transform: scaleX(.88); opacity: .23; } }
    @keyframes leg-front { 0%, 100% { transform: rotate(17deg); } 50% { transform: rotate(-19deg); } }
    @keyframes leg-back { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(19deg); } }
    @keyframes tail-wag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
    @keyframes cape-flutter { 0%, 100% { transform: rotate(-3deg) scaleX(1); } 50% { transform: rotate(3deg) scaleX(1.07); } }
    @keyframes plume-wave { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes spear-tilt { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(2deg); } }
    @keyframes dust-puff { 0% { transform: translate(16px, 8px) scale(.55); opacity: 0; } 25% { opacity: .55; } 100% { transform: translate(-86px, -25px) scale(1.35); opacity: 0; } }
    @keyframes spark-fade { 0%, 100% { opacity: .45; } 50% { opacity: .95; } }

      .masthead p { font-size: 10px; letter-spacing: 2px; }
      .masthead h1 { font-size: 27px; }
      .controls { top: auto; right: 18px; bottom: 21px; }
      .caption { left: 21px; bottom: 86px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage:not(.motion-enabled) .scene * { animation: none !important; }
    }

</head>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const scene = document.getElementById('scene');
      const button = document.getElementById('motion-button');
      const speed = document.getElementById('speed');
      const speedValue = document.getElementById('speed-value');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function updateButton() {
        const paused = stage.classList.contains('is-paused');
        button.textContent = paused ? '▶' : 'Ⅱ';
        button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        button.title = paused ? '播放动画' : '暂停动画';
      }

      function updateViewBox() {
        const ratio = stage.clientWidth / stage.clientHeight;
        if (ratio < 1.2) {
          const width = 960;
          const height = width / ratio;
          scene.setAttribute('viewBox', `240 ${450 - height / 2} ${width} ${height}`);
        } else {
          const width = Math.max(1440, 820 * ratio);
          scene.setAttribute('viewBox', `${(1440 - width) / 2} 0 ${width} 820`);
        }
      }

      function updateSpeed() {
        const rate = Number(speed.value);
        stage.style.setProperty('--gallop', `${(.76 / rate).toFixed(3)}s`);
        stage.style.setProperty('--drift', `${(9 / rate).toFixed(3)}s`);
        speedValue.value = `${rate.toFixed(1)}×`;
      }

      if (reducedMotion.matches) stage.classList.add('is-paused');
      button.addEventListener('click', () => {
        stage.classList.toggle('is-paused');
        if (!stage.classList.contains('is-paused')) stage.classList.add('motion-enabled');
        updateButton();
      });
      speed.addEventListener('input', updateSpeed);
      window.addEventListener('resize', updateViewBox, { passive: true });
      updateButton();
      updateSpeed();
      updateViewBox();
    })();
  </script>
