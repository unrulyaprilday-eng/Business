<!DOCTYPE html>
<html>
  <head>
    <title>第三方登录配置</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet"/>
    <link href="data/styles.css" type="text/css" rel="stylesheet"/>
    <link href="files/第三方登录配置/styles.css" type="text/css" rel="stylesheet"/>
    <link href="custom/css/第三方登录配置.css" type="text/css" rel="stylesheet"/>
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>
    <script src="resources/scripts/axure/axQuery.js"></script>
    <script src="resources/scripts/axure/globals.js"></script>
    <script src="resources/scripts/axutils.js"></script>
    <script src="resources/scripts/axure/annotation.js"></script>
    <script src="resources/scripts/axure/axQuery.std.js"></script>
    <script src="resources/scripts/axure/doc.js"></script>
    <script src="resources/scripts/messagecenter.js"></script>
    <script src="resources/scripts/axure/events.js"></script>
    <script src="resources/scripts/axure/recording.js"></script>
    <script src="resources/scripts/axure/action.js"></script>
    <script src="resources/scripts/axure/expr.js"></script>
    <script src="resources/scripts/axure/geometry.js"></script>
    <script src="resources/scripts/axure/flyout.js"></script>
    <script src="resources/scripts/axure/model.js"></script>
    <script src="resources/scripts/axure/repeater.js"></script>
    <script src="resources/scripts/axure/sto.js"></script>
    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>
    <script src="resources/scripts/axure/math.js"></script>
    <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script>
    <script src="files/第三方登录配置/data.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
  </head>
  <body>
    <div id="base" class="">
      <main class="custom-page-shell third-login-page">
        <header class="page-titlebar">
          <button class="nav-icon" type="button" aria-label="返回">‹</button>
          <button class="nav-icon refresh" type="button" aria-label="刷新">↻</button>
          <span>站点配置</span>
          <b>/</b>
          <strong>第三方登录配置</strong>
        </header>

        <section class="content-panel">
          <div class="summary-head">
            <div>
              <h1><span class="gear-icon">⚙</span>第三方配置</h1>
              <p>管理平台第三方服务集成配置，点击编辑按钮修改对应服务的配置信息</p>
            </div>
          </div>

          <article class="auto-register">
            <div>
              <strong>自动注册</strong>
              <p>登录界面，若用户不存在则自动创建账户</p>
            </div>
            <label class="switch is-on">
              <input type="checkbox" checked/>
              <span data-on="开启" data-off="关闭"></span>
            </label>
          </article>

          <section class="config-grid">
            <article class="login-card">
              <div class="card-head">
                <span class="service-icon telegram">✈</span>
                <div class="service-title">
                  <h2>Telegram配置</h2>
                  <p class="configured"><i></i>已配置</p>
                </div>
                <div class="card-actions">
                  <label class="switch is-on">
                    <input type="checkbox" checked/>
                    <span data-on="开启" data-off="关闭"></span>
                  </label>
                  <button class="edit-btn" type="button">编辑</button>
                  <button class="text-btn" type="button">取消</button>
                  <button class="save-btn" type="button">保存</button>
                </div>
              </div>
              <div class="view-fields"></div>
              <div class="edit-form two-row">
                <label><span>BotToken</span><div class="input-wrap password"><input type="password" value="7639284628:AAH5J89c2nUEJjKZt8JmXWykmpREnqA"/></div></label>
                <label><span>Bot名称</span><input type="text" value="jyowhite_bot"/></label>
              </div>
            </article>

            <article class="login-card">
              <div class="card-head">
                <span class="service-icon email">✉</span>
                <div class="service-title">
                  <h2>邮箱配置</h2>
                  <p><i></i>未配置</p>
                </div>
                <div class="card-actions">
                  <label class="switch">
                    <input type="checkbox"/>
                    <span data-on="开启" data-off="关闭"></span>
                  </label>
                  <button class="edit-btn" type="button">编辑</button>
                  <button class="text-btn" type="button">取消</button>
                  <button class="save-btn" type="button">保存</button>
                </div>
              </div>
              <div class="view-fields"></div>
              <div class="edit-form">
                <label><span>SMTP服务器</span><input type="text" placeholder="请输入SMTP服务器"/></label>
                <label><span>SMTP端口</span><input class="number-input" type="number" placeholder="请输入SMTP端口"/></label>
                <label><span>SMTP账号</span><input type="text" placeholder="请输入SMTP账号"/></label>
                <label><span>SMTP密码</span><div class="input-wrap password"><input type="password" placeholder="请输入SMTP密码"/></div></label>
                <label><span>发件人名称</span><input type="text" placeholder="请输入发件人名称"/></label>
              </div>
            </article>

            <article class="login-card">
              <div class="card-head">
                <span class="service-icon facebook">▯</span>
                <div class="service-title">
                  <h2>Facebook配置</h2>
                  <p><i></i>未配置</p>
                </div>
                <div class="card-actions">
                  <label class="switch">
                    <input type="checkbox"/>
                    <span data-on="开启" data-off="关闭"></span>
                  </label>
                  <button class="edit-btn" type="button">编辑</button>
                  <button class="text-btn" type="button">取消</button>
                  <button class="save-btn" type="button">保存</button>
                </div>
              </div>
              <div class="view-fields"></div>
              <div class="edit-form two-row">
                <label><span>AppId</span><input type="text" placeholder="请输入AppId"/></label>
                <label><span>密钥</span><div class="input-wrap password"><input type="password" placeholder="请输入密钥"/></div></label>
              </div>
            </article>

            <article class="login-card">
              <div class="card-head">
                <span class="service-icon google">⌕</span>
                <div class="service-title">
                  <h2>Google配置</h2>
                  <p><i></i>未配置</p>
                </div>
                <div class="card-actions">
                  <label class="switch">
                    <input type="checkbox"/>
                    <span data-on="开启" data-off="关闭"></span>
                  </label>
                  <button class="edit-btn" type="button">编辑</button>
                  <button class="text-btn" type="button">取消</button>
                  <button class="save-btn" type="button">保存</button>
                </div>
              </div>
              <div class="view-fields"></div>
              <div class="edit-form two-row">
                <label><span>ClientId</span><input type="text" placeholder="请输入ClientId"/></label>
                <label><span>密钥</span><div class="input-wrap password"><input type="password" placeholder="请输入密钥"/></div></label>
              </div>
            </article>

            <article class="login-card">
              <div class="card-head">
                <span class="service-icon whatsapp">☵</span>
                <div class="service-title">
                  <h2>Whatsapp配置</h2>
                  <p><i></i>未配置</p>
                </div>
                <div class="card-actions">
                  <label class="switch">
                    <input type="checkbox"/>
                    <span data-on="开启" data-off="关闭"></span>
                  </label>
                  <button class="edit-btn" type="button">编辑</button>
                  <button class="text-btn" type="button">取消</button>
                  <button class="save-btn" type="button">保存</button>
                </div>
              </div>
              <div class="view-fields"></div>
              <div class="edit-form">
                <label><span>ApiKey</span><div class="input-wrap password"><input type="password" placeholder="请输入ApiKey"/></div></label>
                <label><span>PhoneId</span><input type="text" placeholder="请输入PhoneId"/></label>
                <label><span>BusinessId</span><input type="text" placeholder="请输入BusinessId"/></label>
              </div>
            </article>

            <article class="login-card">
              <div class="card-head">
                <span class="service-icon sms"></span>
                <div class="service-title">
                  <h2>短信配置</h2>
                  <p><i></i>未配置</p>
                </div>
                <div class="card-actions">
                  <label class="switch">
                    <input type="checkbox"/>
                    <span data-on="开启" data-off="关闭"></span>
                  </label>
                  <button class="edit-btn" type="button">编辑</button>
                  <button class="text-btn" type="button">取消</button>
                  <button class="save-btn" type="button">保存</button>
                </div>
              </div>
              <div class="view-fields"></div>
              <div class="edit-form">
                <label><span>短信提供商<br/>(twilio/mock)</span><input type="text" placeholder="请输入短信提供商(twilio/mock)"/></label>
                <label><span>AccountSID</span><input type="text" placeholder="请输入AccountSID"/></label>
                <label><span>AuthToken</span><input type="text" placeholder="请输入AuthToken"/></label>
                <label><span>发送号码</span><input type="text" placeholder="请输入发送号码"/></label>
              </div>
            </article>
          </section>
        </section>
      </main>
    </div>
    <script src="custom/js/第三方登录配置.js"></script>
    <script src="custom/js/axure-custom-page-ready.js"></script>
    <script src="resources/scripts/axure/ios.js"></script>
  </body>
</html>
