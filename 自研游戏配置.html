<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>自研游戏配置</title>

    <link href="data/styles.css" type="text/css" rel="stylesheet" />

    <link href="custom/css/自研游戏配置.css" type="text/css" rel="stylesheet" />
    <link href="custom/css/自研游戏配置页面.css" type="text/css" rel="stylesheet" />
    <script src="resources/scripts/jquery-3.7.1.min.js"></script><script src="resources/scripts/axure/axQuery.js"></script><script src="resources/scripts/axure/globals.js"></script><script src="resources/scripts/axutils.js"></script><script src="resources/scripts/axure/annotation.js"></script><script src="resources/scripts/axure/axQuery.std.js"></script><script src="resources/scripts/axure/doc.js"></script><script src="resources/scripts/messagecenter.js"></script><script src="resources/scripts/axure/events.js"></script><script src="resources/scripts/axure/recording.js"></script><script src="resources/scripts/axure/action.js"></script><script src="resources/scripts/axure/expr.js"></script><script src="resources/scripts/axure/geometry.js"></script><script src="resources/scripts/axure/flyout.js"></script><script src="resources/scripts/axure/model.js"></script><script src="resources/scripts/axure/repeater.js"></script><script src="resources/scripts/axure/sto.js"></script><script src="resources/scripts/axure/utils.temp.js"></script><script src="resources/scripts/axure/variables.js"></script><script src="resources/scripts/axure/drag.js"></script><script src="resources/scripts/axure/move.js"></script><script src="resources/scripts/axure/visibility.js"></script><script src="resources/scripts/axure/style.js"></script><script src="resources/scripts/axure/adaptive.js"></script><script src="resources/scripts/axure/tree.js"></script><script src="resources/scripts/axure/init.temp.js"></script><script src="resources/scripts/axure/legacy.js"></script><script src="resources/scripts/axure/viewer.js"></script><script src="resources/scripts/axure/math.js"></script><script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script><script src="files/自研游戏配置/data.js"></script>
    <script type="text/javascript">$axure.utils.getTransparentGifPath = function () { return 'resources/images/transparent.gif'; }; $axure.utils.getOtherPath = function () { return 'resources/Other.html'; }; $axure.utils.getReloadPath = function () { return 'resources/reload.html'; };</script>
  </head>
  <body>
    <div id="base" class=""><div class="self-game-page"><div class="self-game-shell">
      <nav class="self-game-breadcrumb"><span>游戏中心</span><b>/</b><strong>自研游戏配置</strong></nav>
      <header class="self-game-header"><div><h1>自研游戏配置</h1><p>按游戏能力展示配置入口，RTP、玩法、房间和机器人参数分别维护。</p></div></header>
      <section class="self-game-panel self-game-list-panel"><div class="self-game-panel-head"><div><h2>自研游戏列表</h2><p>每个入口只维护对应模块，不支持的能力不显示。</p></div><div class="self-game-toolbar-right"><span class="self-game-toolbar-note">已选 <strong id="selectedCount">0</strong> 个</span><button class="self-game-btn self-game-btn-primary" id="openBatchRtp" type="button">批量修改 RTP</button></div></div><div class="self-game-panel-body"><div class="self-game-config-tabs"><button class="self-game-config-tab is-active" type="button" data-self-tab-group="mergedTabs" data-self-tab="games">游戏配置</button><button class="self-game-config-tab" type="button" data-self-tab-group="mergedTabs" data-self-tab="records">变更记录</button></div><section data-self-tab-group="mergedTabs" data-self-tab-panel="games"><form class="self-game-filter self-game-list-filter" id="gameFilterForm"><div class="self-game-filter-field self-game-keyword-field"><label for="gameName">游戏名称 / 编码</label><input class="self-game-input" id="gameName" type="text" placeholder="请输入游戏名称或编码" /></div><div class="self-game-filter-field self-game-type-field"><label>游戏类型</label><div class="self-game-segmented" role="tablist" aria-label="游戏类型"><button type="button" data-game-type="全部" class="is-active">全部</button><button type="button" data-game-type="SLOTS">SLOTS</button><button type="button" data-game-type="FISH">FISH</button><button type="button" data-game-type="Poker">Poker</button><button type="button" data-game-type="Mini">Mini</button></div></div><div class="self-game-filter-actions"><button class="self-game-btn self-game-btn-primary" type="submit">查询</button><button class="self-game-btn" id="gameReset" type="button">重置</button></div></form><div class="self-game-table-wrap"><table class="self-game-table self-game-merged-table"><thead><tr><th class="check-cell"><input id="gameSelectAll" type="checkbox" aria-label="全选当前列表" /></th><th>类型</th><th>游戏名称</th><th>游戏编码</th><th>当前配置</th><th>RTP</th><th>更新时间</th><th>配置入口</th></tr></thead><tbody id="gameRows"><tr><td class="check-cell"><input type="checkbox" /></td><td><span class="self-game-type-tag is-slots">SLOTS</span></td><td><strong class="self-game-name">星穹宝藏</strong></td><td><span class="self-game-code">SLOT-1001</span></td><td class="self-game-summary-cell">底分 1 / 5 / 10 · Free Game 支持</td><td class="number-cell"><span class="self-game-rtp">96.0%</span></td><td>2026-08-18 09:30</td><td><div class="self-game-config-actions"><button class="self-game-link" type="button">RTP 配置</button><button class="self-game-link" type="button">投注底分</button><button class="self-game-link" type="button">Free Game</button></div></td></tr></tbody></table></div></section><section data-self-tab-group="mergedTabs" data-self-tab-panel="records" hidden><div class="self-game-table-wrap self-game-merged-records"><table class="self-game-table"><thead><tr><th>时间</th><th>类型</th><th>游戏</th><th>配置模块</th><th>变更</th><th>操作人</th></tr></thead><tbody id="recordRows"><tr class="empty-row"><td colspan="6">暂无变更记录</td></tr></tbody></table></div></section></div></section>
    </div></div>

    <div class="self-game-modal-layer" id="moduleModal" hidden><div class="self-game-modal-mask" data-module-close></div><section class="self-game-modal self-game-module-modal" role="dialog" aria-modal="true" aria-labelledby="moduleTitle"><header class="self-game-modal-head"><h2 id="moduleTitle">模块配置</h2><button class="self-game-close" type="button" data-module-close aria-label="关闭">×</button></header><div class="self-game-modal-body"><div class="self-game-modal-context"><div><span>游戏</span><strong id="moduleGameName">-</strong></div><div><span>编码</span><strong id="moduleGameCode">-</strong></div><div><span>类型</span><strong id="moduleGameType">-</strong></div></div><div id="moduleFields"></div><div class="self-game-batch-preview" id="moduleModalError" hidden></div></div><footer class="self-game-modal-foot"><button class="self-game-btn" type="button" data-module-close>取消</button><button class="self-game-btn self-game-btn-primary" id="applyModule" type="button">确定</button></footer></section></div>
    <div class="self-game-modal-layer" id="batchModal" hidden><div class="self-game-modal-mask" data-batch-close></div><section class="self-game-modal self-game-batch-modal" role="dialog" aria-modal="true" aria-labelledby="batchTitle"><header class="self-game-modal-head"><h2 id="batchTitle">批量修改RTP</h2><button class="self-game-close" type="button" data-batch-close aria-label="关闭">×</button></header><div class="self-game-modal-body"><div class="self-game-capabilities"><div class="self-game-capability-item"><span>配置对象</span><strong id="batchTypeLabel">已勾选游戏</strong></div><div class="self-game-capability-item"><span>允许范围</span><strong>50.0%～200.0%</strong></div><div class="self-game-capability-item"><span>最小步长</span><strong>0.1%</strong></div></div><div class="self-game-form-grid"><div class="self-game-form-field"><label for="batchRtp">RTP</label><div class="self-game-input-wrap"><input class="self-game-input self-game-rtp-input" id="batchRtp" type="number" min="50" max="200" step="0.1" value="96.0" /><span class="self-game-input-suffix">%</span></div><p class="self-game-field-error" id="batchRtpError" hidden></p></div><div class="self-game-form-field"><label for="batchReason">变更原因</label><input class="self-game-input" id="batchReason" type="text" placeholder="请输入变更原因" /><p class="self-game-field-error" id="batchReasonError" hidden></p></div></div><div class="self-game-batch-preview" id="batchPreview">本次将立即更新已勾选游戏的 RTP。</div></div><footer class="self-game-modal-foot"><button class="self-game-btn self-game-btn-quiet" type="button" data-batch-close>取消</button><button class="self-game-btn self-game-btn-primary" id="batchApply" type="button">立即生效</button></footer></section></div>
    <div class="self-game-toast" hidden></div></div>
    <script src="custom/component-library/js/components.js"></script><script src="custom/js/axure-custom-page-ready.js"></script><script src="custom/js/自研游戏配置公共.js"></script><script src="custom/js/自研游戏配置.js"></script><script src="resources/scripts/axure/ios.js"></script>
  </body>
</html>
