<!DOCTYPE html>
<html>
<head>
  <title>营销方案配置</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="resources/css/axure_rp_page.css" rel="stylesheet"/>
  <link href="data/styles.css" rel="stylesheet"/>
  <link href="files/自动策略配置/styles.css" rel="stylesheet"/>
  <link href="custom/component-library/css/tokens.css" rel="stylesheet"/>
  <link href="custom/component-library/css/components.css" rel="stylesheet"/>
  <link href="custom/css/营销运营精简.css" rel="stylesheet"/>
  <script src="resources/scripts/jquery-3.7.1.min.js"></script>
  <script src="resources/scripts/axure/axQuery.js"></script>
  <script src="resources/scripts/axure/globals.js"></script>
  <script src="resources/scripts/axutils.js"></script>
  <script src="resources/scripts/axure/annotation.js"></script>
  <script src="resources/scripts/axure/axQuery.std.js"></script>
  <script src="resources/scripts/axure/doc.js"></script>
  <script src="resources/scripts/messagecenter.js"></script>
  <script src="resources/scripts/axure/events.js"></script>
  <script src="resources/scripts/axure/recording.js"></script>
  <script src="resources/scripts/axure/action.js"></script>
  <script src="resources/scripts/axure/expr.js"></script>
  <script src="resources/scripts/axure/geometry.js"></script>
  <script src="resources/scripts/axure/flyout.js"></script>
  <script src="resources/scripts/axure/model.js"></script>
  <script src="resources/scripts/axure/repeater.js"></script>
  <script src="resources/scripts/axure/sto.js"></script>
  <script src="resources/scripts/axure/utils.temp.js"></script>
  <script src="resources/scripts/axure/variables.js"></script>
  <script src="resources/scripts/axure/drag.js"></script>
  <script src="resources/scripts/axure/move.js"></script>
  <script src="resources/scripts/axure/visibility.js"></script>
  <script src="resources/scripts/axure/style.js"></script>
  <script src="resources/scripts/axure/adaptive.js"></script>
  <script src="resources/scripts/axure/tree.js"></script>
  <script src="resources/scripts/axure/init.temp.js"></script>
  <script src="resources/scripts/axure/legacy.js"></script>
  <script src="resources/scripts/axure/viewer.js"></script>
  <script src="resources/scripts/axure/math.js"></script>
  <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
  <script src="data/document.js"></script>
  <script src="files/自动策略配置/data.js"></script>
</head>
<body>
  <div id="base" class="">
    <div class="mo-page">
      <header class="mo-topbar">
        <div class="mo-crumbs"><span>智能营销方案</span><i>/</i><span>营销运营</span><i>/</i><a href="自动策略中心.html">营销方案</a><i>/</i><strong id="planPageCrumb">创建方案</strong></div>
        <nav class="mo-links"><a href="营销模板管理.html">营销模板</a></nav>
      </header>
      <main class="mo-content mo-content-form">
        <div class="mo-page-head">
          <div><h1 id="planPageTitle">创建营销方案</h1><p>选择目标人群和执行方式，并关联已经配置好的营销内容。</p></div>
        </div>

        <section class="mo-panel">
          <form class="mo-panel-body" id="planForm">
            <section class="mo-form-section">
              <h2>基本信息</h2>
              <div class="mo-form-grid">
                <div class="mo-field"><label for="planName"><span class="mo-required">*</span> 方案名称</label><input class="cl-input" id="planName" value="新人首充转化" placeholder="请输入方案名称"/></div>
                <div class="mo-field"><label for="planTemplate">使用模板</label><select class="cl-select" id="planTemplate"><option value="">不使用模板</option><option value="new-user" data-plan-name="新人首充转化" data-audience="注册7天未首充" data-execution="每日执行" data-time="10:00" data-task="首充引导任务" data-activity="新人首充加赠" data-popup="新人首充提示">新人首充转化</option><option value="recharge" data-plan-name="每日充值促活" data-audience="今日活跃未充值" data-execution="每日执行" data-time="18:00" data-task="每日充值任务" data-activity="每日充值加赠" data-popup="每日充值提醒">每日充值促活</option><option value="return" data-plan-name="7日沉默召回" data-audience="连续7日未登录" data-execution="每日执行" data-time="11:30" data-task="回归签到任务" data-activity="老玩家回归礼" data-popup="沉默玩家召回">沉默玩家召回</option><option value="vip" data-plan-name="高价值玩家关怀" data-audience="高价值活跃玩家" data-execution="每周执行" data-time="每周一 15:00" data-task="专属回馈任务" data-activity="高价值会员礼" data-popup="会员关怀提示">高价值玩家关怀</option><option value="task" data-plan-name="任务中断提醒" data-audience="任务进行中玩家" data-execution="事件触发" data-time="任务中断24小时" data-task="连续签到任务" data-activity="不使用" data-popup="任务中断提醒">任务中断提醒</option><option value="weekend" data-plan-name="周末活跃提升" data-audience="近7日低活跃玩家" data-execution="每周执行" data-time="每周六 10:00" data-task="周末挑战任务" data-activity="周末加赠活动" data-popup="周末活动提示">周末活跃提升</option></select></div>
              </div>
            </section>

            <section class="mo-form-section">
              <h2>目标人群</h2>
              <div class="mo-form-grid">
                <div class="mo-field"><label for="audienceMode"><span class="mo-required">*</span> 人群来源</label><select class="cl-select" id="audienceMode"><option>保存人群</option><option>会员名单</option></select></div>
                <div class="mo-field" id="savedAudienceField"><label for="savedAudience"><span class="mo-required">*</span> 选择人群</label><select class="cl-select" id="savedAudience"><option>注册7天未首充</option><option>今日活跃未充值</option><option>连续7日未登录</option><option>高价值活跃玩家</option><option>任务进行中玩家</option><option>近7日低活跃玩家</option></select></div>
                <div class="mo-field" id="memberListField" hidden><label for="memberList"><span class="mo-required">*</span> 会员名单</label><textarea class="cl-textarea mo-textarea-compact" id="memberList" placeholder="输入会员账号，多个账号用换行分隔"></textarea></div>
              </div>
              <details class="mo-advanced"><summary>排除指定会员</summary><div class="mo-field"><label for="excludedMembers">排除名单</label><textarea class="cl-textarea mo-textarea-compact" id="excludedMembers" placeholder="输入不参与本方案的会员账号，多个账号用换行分隔"></textarea></div></details>
            </section>

            <section class="mo-form-section">
              <h2>执行设置</h2>
              <div class="mo-form-grid three">
                <div class="mo-field"><label for="executionMode"><span class="mo-required">*</span> 执行方式</label><select class="cl-select" id="executionMode"><option>立即执行</option><option selected>每日执行</option><option>每周执行</option><option>事件触发</option></select></div>
                <div class="mo-field" id="executionTimeField"><label for="executionTime" id="executionRuleLabel"><span class="mo-required">*</span> 执行时间</label><input class="cl-input" id="executionTime" value="10:00" placeholder="例如：10:00"/></div>
                <div class="mo-field"><label for="startDate"><span class="mo-required">*</span> 开始日期</label><input class="cl-input" id="startDate" type="date" value="2026-07-28"/></div>
                <div class="mo-field"><label for="endDate">结束日期</label><input class="cl-input" id="endDate" type="date" value="2026-08-31"/></div>
              </div>
            </section>

            <section class="mo-form-section">
              <h2>营销内容</h2>
              <div class="mo-resource-grid">
                <div class="mo-resource"><div class="mo-resource-head"><h3>任务</h3><a class="mo-link" href="任务中心.html">管理任务</a></div><select class="cl-select" id="taskResource"><option>不使用</option><option selected>首充引导任务</option><option>每日充值任务</option><option>回归签到任务</option><option>专属回馈任务</option><option>连续签到任务</option><option>周末挑战任务</option></select></div>
                <div class="mo-resource"><div class="mo-resource-head"><h3>活动</h3><a class="mo-link" href="优惠活动列表.html">管理活动</a></div><select class="cl-select" id="activityResource"><option>不使用</option><option selected>新人首充加赠</option><option>每日充值加赠</option><option>老玩家回归礼</option><option>高价值会员礼</option><option>周末加赠活动</option></select></div>
                <div class="mo-resource"><div class="mo-resource-head"><h3>弹窗</h3><a class="mo-link" href="弹窗管理.html">管理弹窗</a></div><select class="cl-select" id="popupResource"><option>不使用</option><option selected>新人首充提示</option><option>每日充值提醒</option><option>沉默玩家召回</option><option>会员关怀提示</option><option>任务中断提醒</option><option>周末活动提示</option></select></div>
              </div>
              <p class="mo-inline-note">这里只选择已有内容；奖励、展示频次等规则仍在对应的任务、活动或弹窗页面维护。</p>
            </section>

            <div class="mo-form-actions"><a class="cl-btn" href="自动策略中心.html">取消</a><button class="cl-btn" type="button">保存草稿</button><button class="cl-btn cl-btn-primary" type="button" data-cl-modal-open="publishPlanModal">发布方案</button></div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <div class="cl-modal-layer" data-cl-modal="publishPlanModal" hidden>
    <div class="cl-modal-mask"></div>
    <section class="cl-modal mo-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="publishPlanTitle">
      <header class="cl-modal-head"><strong id="publishPlanTitle">确认发布方案</strong><button class="cl-close-btn" type="button" data-cl-modal-close="publishPlanModal" aria-label="关闭">×</button></header>
      <div class="cl-modal-body"><p class="mo-confirm-text">发布后，方案将从设定的开始日期起按执行方式运行。确认发布“新人首充转化”吗？</p></div>
      <footer class="cl-modal-foot"><button class="cl-btn" type="button" data-cl-modal-close="publishPlanModal">取消</button><a class="cl-btn cl-btn-primary" href="自动策略中心.html">确定发布</a></footer>
    </section>
  </div>

  <script src="custom/component-library/js/components.js"></script>
  <script src="custom/js/营销运营精简.js"></script>
  <script src="custom/js/axure-custom-page-ready.js"></script>
  <script src="resources/scripts/axure/ios.js"></script>
</body>
</html>
