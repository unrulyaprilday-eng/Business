<!DOCTYPE html>
<html>
  <head>
    <title>人事列表</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet"/>
    <link href="data/styles.css" type="text/css" rel="stylesheet"/>
    <link href="files/账号管理/styles.css" type="text/css" rel="stylesheet"/>
    <link href="custom/css/账号管理.css" type="text/css" rel="stylesheet"/>
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>
    <script src="resources/scripts/axure/axQuery.js"></script>
    <script src="resources/scripts/axure/globals.js"></script>
    <script src="resources/scripts/axutils.js"></script>
    <script src="resources/scripts/axure/annotation.js"></script>
    <script src="resources/scripts/axure/axQuery.std.js"></script>
    <script src="resources/scripts/axure/doc.js"></script>
    <script src="resources/scripts/messagecenter.js"></script>
    <script src="resources/scripts/axure/events.js"></script>
    <script src="resources/scripts/axure/recording.js"></script>
    <script src="resources/scripts/axure/action.js"></script>
    <script src="resources/scripts/axure/expr.js"></script>
    <script src="resources/scripts/axure/geometry.js"></script>
    <script src="resources/scripts/axure/flyout.js"></script>
    <script src="resources/scripts/axure/model.js"></script>
    <script src="resources/scripts/axure/repeater.js"></script>
    <script src="resources/scripts/axure/sto.js"></script>
    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>
    <script src="resources/scripts/axure/math.js"></script>
    <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script>
    <script src="files/账号管理/data.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
  </head>
  <body>
    <div id="base" class="">
      <div class="custom-page-shell account-page">
        <header class="page-crumb">
          <span class="refresh-icon">↻</span>
          <span>人事中心</span>
          <strong>/ 人事列表</strong>
        </header>

        <main class="account-main">
          <div class="tab-line"><span>员工列表</span></div>
          <section class="toolbar" aria-label="员工筛选">
            <input id="keywordInput" class="search-input" type="text" placeholder="请输入用户名"/>
            <button class="btn btn-primary" type="button" id="searchBtn">⌕ 搜索</button>
            <button class="btn btn-default" type="button" id="resetBtn">↻ 重置</button>
            <button class="btn btn-primary" type="button" data-open-employee="create">新增员工</button>
          </section>

          <div class="table-wrap">
            <table class="account-table" aria-label="员工列表">
              <thead>
                <tr>
                  <th>序号</th>
                  <th>用户名</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>登录IP</th>
                  <th>最后登录时间</th>
                  <th>创建时间</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="accountTableBody"></tbody>
            </table>
          </div>
        </main>

        <div class="modal-layer" id="employeeModal" hidden>
          <div class="modal-mask" data-close-modal></div>
          <section class="employee-dialog" role="dialog" aria-modal="true" aria-labelledby="employeeTitle">
            <header class="dialog-head">
              <h1 id="employeeTitle">新增员工</h1>
              <button class="icon-close" type="button" aria-label="关闭" data-close-modal>×</button>
            </header>
            <form class="dialog-body">
              <label class="form-row required">
                <span>登录账号</span>
                <input id="loginNameInput" type="text" placeholder="请输入登录账号"/>
              </label>
              <label class="form-row">
                <span>登录密码</span>
                <span class="password-field">
                  <input id="passwordInput" type="password" placeholder="请输入登录密码（至少6位）"/>
                  <button class="eye-btn" type="button" aria-label="显示密码">●</button>
                </span>
              </label>
              <div class="form-row required">
                <span>所属角色</span>
                <div class="select-box" id="roleSelect">
                  <button class="select-trigger" type="button">
                    <span id="roleValue">商户管理员</span>
                    <i class="select-clear" aria-hidden="true">×</i>
                    <i class="select-arrow" aria-hidden="true"></i>
                  </button>
                  <div class="select-menu" hidden>
                    <button type="button" data-role="商户管理员">商户管理员</button>
                    <button type="button" data-role="商户客服">商户客服</button>
                  </div>
                </div>
              </div>
              <fieldset class="form-row status-row">
                <legend>账号状态</legend>
                <label><input type="radio" name="status" value="正常" checked/><span>正常</span></label>
                <label><input type="radio" name="status" value="冻结"/><span>冻结</span></label>
              </fieldset>
            </form>
            <footer class="dialog-foot">
              <button class="btn btn-primary" type="button" data-close-modal>确定</button>
              <button class="btn btn-default" type="button" data-close-modal>取消</button>
            </footer>
          </section>
        </div>

        <div class="modal-layer" id="confirmModal" hidden>
          <div class="modal-mask" data-close-confirm></div>
          <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <header class="dialog-head">
              <h1 id="confirmTitle">系统提示</h1>
              <button class="icon-close" type="button" aria-label="关闭" data-close-confirm>×</button>
            </header>
            <div class="confirm-body">
              <span class="question-icon">?</span>
              <span>确定要重置该员工的Google验证器吗?</span>
            </div>
            <footer class="dialog-foot">
              <button class="btn btn-default" type="button" data-close-confirm>取消</button>
              <button class="btn btn-primary" type="button" data-close-confirm>确认</button>
            </footer>
          </section>
        </div>
      </div>
    </div>
    <script src="custom/js/axure-custom-page-ready.js"></script>
    <script src="resources/scripts/axure/ios.js"></script>
    <script src="custom/js/账号管理.js"></script>
  </body>
</html>
