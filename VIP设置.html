<!DOCTYPE html>
<html>
  <head>
    <title>VIP设置</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet"/>
    <link href="data/styles.css" type="text/css" rel="stylesheet"/>
    <link href="files/VIP设置/styles.css" type="text/css" rel="stylesheet"/>
    <link href="custom/css/VIP设置.css" type="text/css" rel="stylesheet"/>
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>
    <script src="resources/scripts/axure/axQuery.js"></script>
    <script src="resources/scripts/axure/globals.js"></script>
    <script src="resources/scripts/axutils.js"></script>
    <script src="resources/scripts/axure/annotation.js"></script>
    <script src="resources/scripts/axure/axQuery.std.js"></script>
    <script src="resources/scripts/axure/doc.js"></script>
    <script src="resources/scripts/messagecenter.js"></script>
    <script src="resources/scripts/axure/events.js"></script>
    <script src="resources/scripts/axure/recording.js"></script>
    <script src="resources/scripts/axure/action.js"></script>
    <script src="resources/scripts/axure/expr.js"></script>
    <script src="resources/scripts/axure/geometry.js"></script>
    <script src="resources/scripts/axure/flyout.js"></script>
    <script src="resources/scripts/axure/model.js"></script>
    <script src="resources/scripts/axure/repeater.js"></script>
    <script src="resources/scripts/axure/sto.js"></script>
    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>
    <script src="resources/scripts/axure/math.js"></script>
    <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script>
    <script src="files/VIP设置/data.js"></script>
    <script src="custom/js/axure-custom-page-ready.js"></script>
    <script src="resources/scripts/axure/ios.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
  </head>
  <body>
    <div id="base" class="">
      <div class="custom-page-shell vip-settings-page">
        <nav class="vip-tabs" aria-label="VIP设置标签">
          <button class="tab-btn is-active" type="button" data-tab="level" aria-pressed="true">VIP晋级条件</button>
          <button class="tab-btn" type="button" data-tab="weekly" aria-pressed="false">周工资</button>
          <button class="tab-btn" type="button" data-tab="monthly" aria-pressed="false">月工资</button>
          <button class="tab-btn" type="button" data-tab="birthday" aria-pressed="false">生日奖励</button>
          <button class="tab-btn" type="button" data-tab="whale" aria-pressed="false">大R等级定义</button>
        </nav>
        <div class="vip-actionbar">
          <h1 class="vip-section-title">VIP晋级条件</h1>
          <div class="vip-actions" aria-label="配置编辑操作">
            <button class="btn btn-default" type="button" data-action="add" hidden>新增等级</button>
            <button class="btn btn-default" type="button" data-action="remove" hidden>删除最高等级</button>
            <button class="btn btn-primary" type="button" data-action="edit">
              <svg class="btn-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5l3 3M4 13l-.5 3.5L7 16l9-9a2.1 2.1 0 0 0-3-3z"/></svg>
              <span>编辑</span>
            </button>
          </div>
          <div class="vip-config-controls">
            <div class="vip-control-group" data-control="mode" role="group" aria-label="晋级条件类型">
              <span class="vip-control-label" data-mode-label>晋级条件</span>
              <label><input type="radio" name="vip-promotion-mode" value="recharge" checked disabled/><span>累计充值</span></label>
              <label><input type="radio" name="vip-promotion-mode" value="wager" disabled/><span>累计打码</span></label>
            </div>
            <div class="vip-control-group" data-control="enabled" hidden>
              <span class="vip-control-label">配置开关</span>
              <label class="vip-switch"><input type="checkbox" aria-label="启用当前奖励配置" checked disabled/><span class="vip-switch-track" aria-hidden="true"></span><span>启用</span></label>
            </div>
          </div>
          <p class="vip-config-description" data-hint>按累计充值门槛晋级，VIP0 为默认等级。</p>
          <p class="vip-error" data-error role="alert" hidden></p>
        </div>
        <main class="vip-table-panel">
          <table class="vip-table" aria-label="VIP晋级条件表格">
            <thead><tr><th>VIP等级</th><th>累计充值</th><th>晋级奖励</th></tr></thead>
            <tbody>
              <tr><td>VIP0 <span class="vip-default-tag">默认</span></td><td>-</td><td>-</td></tr>
              <tr><td>VIP1</td><td>20</td><td>20</td></tr>
              <tr><td>VIP2</td><td>50</td><td>40</td></tr>
              <tr><td>VIP3</td><td>100</td><td>100</td></tr>
              <tr><td>VIP4</td><td>150</td><td>200</td></tr>
              <tr><td>VIP5</td><td>200</td><td>400</td></tr>
              <tr><td>VIP6</td><td>400</td><td>600</td></tr>
              <tr><td>VIP7</td><td>800</td><td>800</td></tr>
              <tr><td>VIP8</td><td>1000</td><td>1000</td></tr>
              <tr><td>VIP9</td><td>1500</td><td>1200</td></tr>
              <tr><td>VIP10</td><td>2000</td><td>1400</td></tr>
            </tbody>
          </table>
        </main>
        <footer class="vip-savebar" data-footer hidden>
          <span>修改后请保存生效</span>
          <button class="btn btn-default" type="button" data-action="cancel">取消</button>
          <button class="btn btn-primary" type="button" data-action="save">保存</button>
        </footer>
        <dialog class="confirm-dialog" data-confirm aria-labelledby="vipConfirmTitle">
          <header class="confirm-header">
            <h2 id="vipConfirmTitle">操作确认</h2>
            <button class="dialog-close" type="button" data-action="dismiss" aria-label="关闭弹窗">×</button>
          </header>
          <div class="confirm-body"><span class="warning-icon" aria-hidden="true">!</span><span data-message>确认执行当前操作吗？</span></div>
          <footer class="confirm-footer">
            <button class="btn btn-default" type="button" data-action="dismiss">取消</button>
            <button class="btn btn-primary" type="button" data-action="confirm">确定</button>
          </footer>
        </dialog>
      </div>
    </div>
    <script src="custom/js/VIP设置.js"></script>
  </body>
</html>
