<!DOCTYPE html>
<html>
  <head>
    <title>VIP设置</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet"/>
    <link href="data/styles.css" type="text/css" rel="stylesheet"/>
    <link href="files/VIP设置/styles.css" type="text/css" rel="stylesheet"/>
    <link href="custom/css/VIP设置.css" type="text/css" rel="stylesheet"/>
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>
    <script src="resources/scripts/axure/axQuery.js"></script>
    <script src="resources/scripts/axure/globals.js"></script>
    <script src="resources/scripts/axutils.js"></script>
    <script src="resources/scripts/axure/annotation.js"></script>
    <script src="resources/scripts/axure/axQuery.std.js"></script>
    <script src="resources/scripts/axure/doc.js"></script>
    <script src="resources/scripts/messagecenter.js"></script>
    <script src="resources/scripts/axure/events.js"></script>
    <script src="resources/scripts/axure/recording.js"></script>
    <script src="resources/scripts/axure/action.js"></script>
    <script src="resources/scripts/axure/expr.js"></script>
    <script src="resources/scripts/axure/geometry.js"></script>
    <script src="resources/scripts/axure/flyout.js"></script>
    <script src="resources/scripts/axure/model.js"></script>
    <script src="resources/scripts/axure/repeater.js"></script>
    <script src="resources/scripts/axure/sto.js"></script>
    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>
    <script src="resources/scripts/axure/math.js"></script>
    <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script>
    <script src="files/VIP设置/data.js"></script>
    <script src="custom/js/axure-custom-page-ready.js"></script>
    <script src="resources/scripts/axure/ios.js"></script>
    <script src="custom/js/VIP设置.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
  </head>
  <body>
    <div id="base" class="">
      <div class="custom-page-shell vip-settings-page">
        <nav class="vip-tabs" aria-label="VIP设置标签">
          <button class="tab-btn is-active" type="button" data-tab="level">VIP晋级条件</button>
          <button class="tab-btn" type="button" data-tab="keep">VIP降级配置</button>
          <button class="tab-btn" type="button" data-tab="daily">日俸禄</button>
          <button class="tab-btn" type="button" data-tab="weekly">周俸禄</button>
          <button class="tab-btn" type="button" data-tab="monthly">月俸禄</button>
          <button class="tab-btn" type="button" data-tab="whale">大R等级定义</button>
        </nav>
        <div class="vip-actionbar">
          <button class="btn btn-primary" type="button" data-action="edit">✎ 编辑</button>
          <div class="vip-inline-toggle" aria-label="当前配置状态" hidden>
            <span class="vip-toggle-title">配置开关</span>
            <button class="feature-switch is-on" type="button" role="switch" aria-checked="true" data-action="toggle-setting" aria-label="切换当前配置状态">
              <span class="feature-switch-track">
                <span class="feature-switch-thumb"></span>
              </span>
              <span class="feature-switch-text">已开启</span>
            </button>
            <span class="vip-toggle-hint">开启后，当前设置生效。</span>
          </div>
          <button class="btn btn-primary" type="button" data-action="save" hidden>▣ 保存</button>
          <button class="btn btn-default" type="button" data-action="cancel" hidden>× 取消</button>
        </div>
        <main class="vip-table-panel">
          <table class="vip-table" aria-label="VIP设置表格">
            <thead>
              <tr>
                <th>VIP等级</th>
                <th>累计充值</th>
                <th>打码条件</th>
                <th>奖励金额</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>1</td><td>0</td><td>0</td><td>0</td></tr>
              <tr class="is-focus-row"><td>2</td><td>20</td><td>100</td><td>20</td></tr>
              <tr><td>3</td><td>50</td><td>200</td><td>40</td></tr>
              <tr><td>4</td><td>100</td><td>400</td><td>100</td></tr>
              <tr><td>5</td><td>150</td><td>500</td><td>200</td></tr>
              <tr><td>6</td><td>200</td><td>1000</td><td>400</td></tr>
              <tr><td>7</td><td>400</td><td>1500</td><td>600</td></tr>
              <tr><td>8</td><td>800</td><td>2000</td><td>800</td></tr>
              <tr><td>9</td><td>1000</td><td>3000</td><td>1000</td></tr>
              <tr><td>10</td><td>1500</td><td>4000</td><td>1200</td></tr>
              <tr><td>11</td><td>2000</td><td>5000</td><td>1400</td></tr>
              <tr><td>12</td><td>4000</td><td>7000</td><td>1600</td></tr>
              <tr><td>13</td><td>8000</td><td>8000</td><td>2000</td></tr>
              <tr><td>14</td><td>10000</td><td>12000</td><td>2500</td></tr>
              <tr><td>15</td><td>15000</td><td>20000</td><td>3000</td></tr>
            </tbody>
          </table>
        </main>
        <div class="modal-mask" data-dialog="cancel" hidden>
          <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="cancelTitle">
            <header class="confirm-header">
              <h2 id="cancelTitle">提示</h2>
              <button class="dialog-close" type="button" data-dialog-close>×</button>
            </header>
            <div class="confirm-body">
              <span class="warning-icon">?</span>
              <span>确认放弃本次编辑的内容吗?</span>
            </div>
            <footer class="confirm-footer">
              <button class="btn btn-default" type="button" data-dialog-close>取消</button>
              <button class="btn btn-primary" type="button" data-action="confirm-cancel">确认</button>
            </footer>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
