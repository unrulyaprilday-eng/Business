<!DOCTYPE html>
<html>
  <head>
    <title>活动统计报表</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="resources/css/axure_rp_page.css" type="text/css" rel="stylesheet" />
    <link href="data/styles.css" type="text/css" rel="stylesheet" />
    <link href="files/活动统计报表/styles.css" type="text/css" rel="stylesheet" />
    <link href="custom/css/活动统计报表.css" type="text/css" rel="stylesheet" />
    <script src="resources/scripts/jquery-3.7.1.min.js"></script>
    <script src="resources/scripts/axure/axQuery.js"></script>
    <script src="resources/scripts/axure/globals.js"></script>
    <script src="resources/scripts/axutils.js"></script>
    <script src="resources/scripts/axure/annotation.js"></script>
    <script src="resources/scripts/axure/axQuery.std.js"></script>
    <script src="resources/scripts/axure/doc.js"></script>
    <script src="resources/scripts/messagecenter.js"></script>
    <script src="resources/scripts/axure/events.js"></script>
    <script src="resources/scripts/axure/recording.js"></script>
    <script src="resources/scripts/axure/action.js"></script>
    <script src="resources/scripts/axure/expr.js"></script>
    <script src="resources/scripts/axure/geometry.js"></script>
    <script src="resources/scripts/axure/flyout.js"></script>
    <script src="resources/scripts/axure/model.js"></script>
    <script src="resources/scripts/axure/repeater.js"></script>
    <script src="resources/scripts/axure/sto.js"></script>
    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>
    <script src="resources/scripts/axure/style.js"></script>
    <script src="resources/scripts/axure/adaptive.js"></script>
    <script src="resources/scripts/axure/tree.js"></script>
    <script src="resources/scripts/axure/init.temp.js"></script>
    <script src="resources/scripts/axure/legacy.js"></script>
    <script src="resources/scripts/axure/viewer.js"></script>
    <script src="resources/scripts/axure/math.js"></script>
    <script src="resources/scripts/axure/jquery.nicescroll.min.js"></script>
    <script src="data/document.js"></script>
    <script src="files/活动统计报表/data.js"></script>
    <script src="custom/js/axure-custom-page-ready.js"></script>
    <script src="resources/scripts/axure/ios.js"></script>
    <script type="text/javascript">
      $axure.utils.getTransparentGifPath = function () {
        return "resources/images/transparent.gif";
      };
      $axure.utils.getOtherPath = function () {
        return "resources/Other.html";
      };
      $axure.utils.getReloadPath = function () {
        return "resources/reload.html";
      };
    </script>
  </head>
  <body>
    <div id="base" class="">
      <div class="custom-page-shell activity-report-page">
        <header class="page-titlebar">
          <button class="title-icon" type="button" aria-label="返回">&lsaquo;</button>
          <button class="title-icon refresh" id="refreshPageButton" type="button" aria-label="刷新">&#8635;</button>
          <span>活动报表</span>
          <b>/</b>
          <strong>活动统计报表</strong>
        </header>

        <main class="page-content">
          <div class="report-card">
            <section class="toolbar-panel">
              <div class="panel-head compact">
                <div>
                  <h1>活动统计报表</h1>
                </div>
                <div class="action-group">
                  <button class="btn primary" id="exportButton" type="button">导出数据</button>
                </div>
              </div>

              <form class="filter-bar" id="reportFilterBar">
                <div class="filter-row">
                  <label class="field select-field">
                    <span>活动类型</span>
                    <select id="activityTypeFilter">
                      <option value="all">全部类型</option>
                      <option value="deposit">首充活动</option>
                      <option value="rebate">返水活动</option>
                      <option value="rescue">救援金活动</option>
                      <option value="tournament">竞赛活动</option>
                    </select>
                  </label>
                  <div class="action-group compact">
                    <button class="btn primary" id="searchButton" type="button">查询</button>
                    <button class="btn ghost" id="resetButton" type="reset">重置</button>
                  </div>
                </div>
                <div class="filter-row advanced-row" id="advancedFilters">
                  <label class="field">
                    <span>活动ID</span>
                    <input type="text" id="activityIdFilter" placeholder="请输入活动ID" />
                  </label>
                  <label class="field">
                    <span>活动名称</span>
                    <input type="text" id="activityNameFilter" placeholder="请输入活动名称" />
                  </label>
                  <label class="field select-field">
                    <span>状态</span>
                    <select id="activityStatusFilter">
                      <option value="all">全部状态</option>
                      <option value="running">进行中</option>
                      <option value="pending">待开始</option>
                      <option value="ended">已结束</option>
                    </select>
                  </label>
                  <label class="field date-range-field">
                    <span>活动时间</span>
                    <input type="text" placeholder="开始时间" />
                    <em class="range-sep">至</em>
                    <input type="text" placeholder="结束时间" />
                  </label>
                </div>
              </form>
            </section>

            <section class="table-panel">
              <div class="table-meta">
                <div class="meta-left">
                  <strong id="tableTitle">活动列表</strong>
                  <span id="tableSubline">共 12 个活动，支持直接查看参与玩家与派奖情况。</span>
                  <span id="ticketStatNote">票券形式发放的奖励，派奖金额按最终从票券领取的金额统计。</span>
                </div>
              </div>

              <div class="table-shell">
                <div class="table-wrap">
                  <table class="report-table" id="reportTable">
                    <thead>
                      <tr>
                        <th>活动ID</th>
                        <th>活动名称</th>
                        <th>活动类型</th>
                        <th>活动时间</th>
                        <th>参与人数</th>
                        <th>领取人数</th>
                        <th>派奖金额</th>
                        <th>奖励到账目标</th>
                        <th>状态</th>
                        <th>操作</th>
                      </tr>
                    </thead>
                    <tbody id="reportTableBody">
                      <tr>
                        <td>AC240601</td>
                        <td>6月首充加赠</td>
                        <td>首充活动</td>
                        <td>2026-06-01 至 2026-06-30</td>
                        <td class="num">12,860</td>
                        <td class="num">5,126</td>
                        <td class="num positive">826,400.00</td>
                        <td><span class="reward-target-badge piggy-bank">存钱罐</span></td>
                        <td><span class="status-tag running">进行中</span></td>
                        <td><button class="link-btn" type="button">查看玩家</button></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <footer class="pagination-bar">
                <button class="page-btn disabled" type="button" aria-label="首页">|&lsaquo;</button>
                <button class="page-btn disabled" type="button" aria-label="上一页">&lsaquo;</button>
                <button class="page-btn current" type="button">1</button>
                <button class="page-btn" type="button">2</button>
                <button class="page-btn" type="button">3</button>
                <button class="page-btn" type="button" aria-label="下一页">&rsaquo;</button>
                <button class="page-btn" type="button" aria-label="末页">&rsaquo;|</button>
                <input class="page-input" type="text" value="1" aria-label="当前页" />
                <span>/ 3</span>
                <select class="page-size" aria-label="每页条数">
                  <option>10条/页</option>
                  <option>20条/页</option>
                  <option>50条/页</option>
                </select>
                <span id="pageTotalText">共 12 条记录</span>
              </footer>
            </section>
          </div>
        </main>
      </div>

    </div>
    <script src="custom/js/活动统计报表.js"></script>
  </body>
</html>
