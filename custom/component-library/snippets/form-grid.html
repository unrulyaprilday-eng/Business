<div class="cl-form-grid">
  <div class="cl-form-field">
    <label for="formName"><span class="cl-required">*</span>名称</label>
    <input class="cl-input" id="formName" type="text" placeholder="请输入名称">
  </div>
  <div class="cl-form-field">
    <label for="formType">类型</label>
    <select class="cl-select" id="formType">
      <option>默认类型</option>
      <option>活动类型</option>
      <option>报表类型</option>
    </select>
  </div>
  <div class="cl-form-field">
    <label for="formSort">排序</label>
    <input class="cl-input" id="formSort" type="number" value="10">
  </div>
  <div class="cl-form-field">
    <label for="formStatus">状态</label>
    <select class="cl-select" id="formStatus">
      <option>启用</option>
      <option>停用</option>
    </select>
  </div>
  <div class="cl-form-field is-wide">
    <label for="formRemark">备注</label>
    <textarea class="cl-textarea" id="formRemark" placeholder="请输入备注"></textarea>
  </div>
</div>
