  <body>
    <div id="base" class="">
      <div class="custom-page-shell withdraw-exempt-page">
        <main class="page-panel">
          <section class="filter-bar" aria-label="会员提现免首充筛选">
            <label class="filter-field">
              <span>会员ID:</span>
              <input id="memberIdFilter" type="text" placeholder="请输入会员ID"/>
            </label>
            <label class="filter-field">
              <span>会员账号:</span>
              <input id="memberAccountFilter" type="text" placeholder="请输入会员账号"/>
            </label>
            <button class="btn btn-primary" id="searchBtn" type="button">搜索</button>
            <button class="btn" id="resetBtn" type="button">重置</button>
            <button class="btn btn-primary" id="createBtn" type="button">新增</button>
          </section>

          <section class="notice-bar" aria-label="页面说明">
            <span>注：添加进这个列表的用户提现不受提款参数设置首次提款要求累计充值金额达到多少的限制。</span>
          </section>

          <section class="table-panel" aria-label="会员提现免首充列表">
            <table class="data-table">
              <thead>
                <tr>
                  <th>会员ID</th>
                  <th>会员账号</th>
                  <th>备注</th>
                  <th>操作人</th>
                  <th>操作时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr class="empty-row">
                  <td colspan="6">暂无数据</td>
                </tr>
              </tbody>
            </table>
          </section>
        </main>

        <div class="modal-mask" id="formModal" hidden>
          <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <header class="modal-head">
              <h3 id="modalTitle">新增</h3>
              <button class="modal-close" id="closeModalBtn" type="button" aria-label="关闭">×</button>
            </header>
            <div class="modal-body">
              <label class="form-row is-required">
                <span>会员ID:</span>
                <textarea id="memberIdsInput" placeholder="请输入会员ID，多个请用英文逗号隔开"></textarea>
              </label>
              <label class="form-row">
                <span>备注:</span>
                <textarea id="remarkInput" placeholder="请输入备注"></textarea>
              </label>
            </div>
            <footer class="modal-foot">
              <button class="btn" id="cancelBtn" type="button">取消</button>
              <button class="btn btn-primary" id="submitBtn" type="button">提交</button>
            </footer>
          </div>
        </div>
      </div>

    <script src="custom/js/axure-custom-page-ready.js"></script>
