    <script src="resources/scripts/axure/utils.temp.js"></script>
    <script src="resources/scripts/axure/variables.js"></script>
    <script src="resources/scripts/axure/drag.js"></script>
    <script src="resources/scripts/axure/move.js"></script>
    <script src="resources/scripts/axure/visibility.js"></script>

      $axure.utils.getTransparentGifPath = function() { return 'resources/images/transparent.gif'; };
      $axure.utils.getOtherPath = function() { return 'resources/Other.html'; };
      $axure.utils.getReloadPath = function() { return 'resources/reload.html'; };
    </script>
  </head>
  <body>
    <div id="base" class="">
      <div class="custom-page-shell piggy-config-page">
        <header class="piggy-page-head">
          <div>
            <div class="piggy-breadcrumb">优惠活动 / PIGGYBANK配置</div>
            <h1>PIGGYBANK配置</h1>
          </div>
          <div class="cl-action-group">
            <a class="piggy-link-btn" href="PIGGY BANK参与记录.html">参与记录</a>
            <button class="piggy-btn primary" type="button" data-edit-action="edit">修改</button>
          </div>
        </header>

        <main class="piggy-workspace is-readonly" data-edit-root>
          <section class="piggy-config-section">
            <section class="cl-panel">
              <div class="cl-panel-head">
                <div class="cl-panel-title">
                  <strong>活动基础信息</strong>
                </div>
              </div>
              <div class="cl-panel-body">
                <div class="cl-form-grid">
                  <div class="cl-form-field">
                    <label>活动名称</label>
                    <div class="piggy-static-field">PIGGYBANK</div>
                  </div>
                  <div class="cl-form-field">
                    <label>活动总开关</label>
                    <div class="piggy-switch-field"><button class="cl-switch-button is-on js-switch" type="button" aria-label="活动总开关" data-on-label="已开启" data-off-label="已关闭"></button><span data-switch-label>已开启</span></div>
                  </div>
                </div>
              </div>
            </section>
          </section>

          <section class="piggy-config-section">
            <section class="cl-panel">
              <div class="cl-panel-head">
                <div class="cl-panel-title">
                  <strong>前置游戏配置</strong>
                </div>
              </div>
              <div class="cl-panel-body">
                <div class="cl-form-grid">
                  <div class="cl-form-field">
                    <label><span class="cl-required">*</span>免费SPIN次数</label>
                    <input class="cl-input piggy-narrow-input js-spin-count" type="number" value="5" min="1" max="100" data-fixed-spin-count/>
                  </div>
                  <div class="cl-form-field">
                    <label><span class="cl-required">*</span>BET值</label>
                    <input class="cl-input piggy-narrow-input js-bet-value" type="number" value="1.00" min="0" step="0.01"/>
                  </div>
                  <div class="cl-form-field">
                    <label><span class="cl-required">*</span>最终总金额范围</label>
                    <div class="piggy-inline-inputs">
                      <input class="cl-input piggy-narrow-input js-range-min" type="number" value="10.00" step="0.01" aria-label="最终总金额最小值"/>
                      <span class="piggy-range-separator" aria-hidden="true">-</span>
                      <input class="cl-input piggy-narrow-input js-range-max" type="number" value="20.00" step="0.01" aria-label="最终总金额最大值"/>
                    </div>
                    <div class="piggy-range-help">
                      <span data-theoretical-range>理论最低金额：10.00；理论最高金额：5000.00</span>
                      <span class="is-valid" data-reachable-summary>当前范围内存在 5 个可达结果，可以保存。</span>
                    </div>
                  </div>
                </div>
                <div class="piggy-warning" data-rule-warning role="alert" aria-live="polite" hidden></div>
              </div>
            </section>
          </section>

          <footer class="piggy-form-actions">
            <button class="piggy-btn" type="button" data-edit-action="cancel" hidden>取消</button>
            <button class="piggy-btn primary" type="button" data-edit-action="save" hidden>保存</button>
          </footer>
          <section class="piggy-desc-panel">
            <strong>说明</strong>
            <ul class="piggy-desc-list">
              <li>理论最低金额 = 2 × 免费 SPIN 次数 × BET 值；理论最高金额 = 1000 × 免费 SPIN 次数 × BET 值。</li>
              <li>保存时会校验金额范围内是否至少存在 1 个可达结果；若不存在，将阻止保存并提示调整配置。</li>
            </ul>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
